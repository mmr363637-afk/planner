<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="برنامه‌ریز مطالعه" />

    <meta
      name="description"
      content="برنامه‌ریز مطالعه شخصی برای دانشجویان پزشکی — تمرکز، مرور، آزمون و گزارش"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />

    <!-- فایل‌های PWA مستقیماً از public/ سرو می‌شوند. مسیرها را از ریشه بنویسید تا
         Vite آن‌ها را هَش (bundle) نکند؛ سرویس‌ورکر دقیقاً همین نام‌ها را پیش‌کش
         می‌کند و در build به زیرمسیرِ GitHub Pages («./…») تبدیل می‌شوند. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <title>برنامه‌ریز مطالعه | Study Planner</title>
  </head>

  <body>
    <div id="root"></div>

    <!-- نقطهٔ ورود واقعی اپ. این خط را هرگز با خروجی build جایگزین نکنید: اگر
         محتوای build شدهٔ inlined روی همین فایل کپی شود، هم `npm run dev` و هم
         `npm run build` دیگر هیچ‌وقت src/ را کامپایل نمی‌کنند و تمام فیچرهای جدید
         از دید کاربر ناپدید می‌شوند. خروجی build فقط در docs/ نوشته می‌شود. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
