<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="برنامه‌ریز مطالعه" />

    <meta
      name="description"
      content="برنامه‌ریز مطالعه شخصی برای دانشجویان پزشکی — تمرکز، مرور، آزمون و گزارش"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:title" content="برنامه‌ریز مطالعه 📚" />
    <meta property="og:description" content="برنامه‌ریزی هوشمند، مرور فاصله‌دار، تایمر تمرکز و آمار — کاملاً فارسی و آفلاین" />
    <meta property="og:image" content="https://mmr363637-afk.github.io/planner/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="برنامه‌ریز مطالعه 📚" />
    <meta name="twitter:description" content="برنامه‌ریزی هوشمند، مرور فاصله‌دار، تایمر تمرکز و آمار — کاملاً فارسی و آفلاین" />

    <!-- فونت وزیرمتنِ خود-میزبان (public/fonts): آفلاین-اول، بدون CDN. -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face{font-family:Vazirmatn;font-weight:400;font-display:swap;src:url(./fonts/Vazirmatn-Regular.woff2) format(woff2)}
      @font-face{font-family:Vazirmatn;font-weight:500;font-display:swap;src:url(./fonts/Vazirmatn-Medium.woff2) format(woff2)}
      @font-face{font-family:Vazirmatn;font-weight:700;font-display:swap;src:url(./fonts/Vazirmatn-Bold.woff2) format(woff2)}
      @font-face{font-family:Vazirmatn;font-weight:800;font-display:swap;src:url(./fonts/Vazirmatn-ExtraBold.woff2) format(woff2)}
      @font-face{font-family:Vazirmatn;font-weight:900;font-display:swap;src:url(./fonts/Vazirmatn-Black.woff2) format(woff2)}
    </style>

    <!-- فایل‌های PWA مستقیماً از public/ سرو می‌شوند. مسیرها را از ریشه بنویسید تا
         Vite آن‌ها را هَش (bundle) نکند؛ سرویس‌ورکر دقیقاً همین نام‌ها را پیش‌کش
         می‌کند و در build به زیرمسیرِ GitHub Pages («./…») تبدیل می‌شوند. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <title>برنامه‌ریز مطالعه | Study Planner</title>
  </head>

  <body>
    <div id="root"></div>

    <!-- نقطهٔ ورود واقعی اپ. این خط را هرگز با خروجی build جایگزین نکنید: اگر
         محتوای build شدهٔ inlined روی همین فایل کپی شود، هم `npm run dev` و هم
         `npm run build` دیگر هیچ‌وقت src/ را کامپایل نمی‌کنند و تمام فیچرهای جدید
         از دید کاربر ناپدید می‌شوند. خروجی build فقط در docs/ نوشته می‌شود. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
