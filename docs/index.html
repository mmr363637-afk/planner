‌شود."},{text:"اشکالی ندارد آهسته پیش بروی؛ اشکال دارد که بایستی."},{text:"سخت‌کوشی، استعدادِ همه‌کس است؛ هر روز تمرینش کن."},{text:"اگر مسیر درست را می‌روی، حتی قدم‌های کوچکت هم تو را به مقصد می‌رساند."},{text:"مغز تو هر بار که چیزی یاد می‌گیرد، قوی‌تر می‌شود؛ امروز هم تمرینش بده."},{text:"انرژی‌ات را صرف نگرانی نکن؛ صرف خواندنِ همان یک صفحه‌ای کن که جلوی توست."},{text:"وقتی اراده می‌کنی، بهانه‌ها خودشان کوچک می‌شوند."},{text:"قدرت در یک روزِ عالی نیست؛ در روزهای معمولی‌ای است که تکرارشان می‌کنی."},{text:"نظم، پلِ بینِ آرزو و واقعیت است."},{text:"بهترین برنامه، برنامه‌ای است که امروز شروعش کنی، نه فردا."},{text:"هر روز کمی مطالعه، بهتر از یک روزِ سنگین و هفته‌ها فاصله است."},{text:"عادت‌های کوچک روزانه، نتایج بزرگی می‌سازند که سال بعد شگفت‌زده‌ات می‌کند."},{text:"تقویم پر از روزهای خالی است؛ تو می‌توانی بهترین‌هایش را پر کنی."},{text:"دیروز رفته و فردا نیامده؛ تنها امروز را داری، پس امروز را دریاب."},{text:"برنامه ریختن نصف کار است؛ نصف دیگرش، همان‌قسمتِ اولِ امروز است."},{text:"انضباط یعنی انتخابِ چیزی که می‌خواهی، نه چیزی که الان دلت می‌خواهد."},{text:"اگر هر روز فقط یک ساعت عمیق درس بخوانی، در یک سال ۳۶۵ ساعت جلو می‌افتی."},{text:"یک روز جا زدن، آسان است؛ برگشتن به مسیر، نشانه‌ی بزرگی توست."},{text:"هر روز صبح یک قرار داری: با کتابی که فردای بهتری برایت می‌سازد."},{text:"وقتی برنامه می‌چینی، به قولت پایبند باش؛ حتی اگر فقط ده دقیقه باشد."},{text:"تمرینِ هر روز، از حافظه‌ات یک گنجینه می‌سازد."},{text:"جایزه‌ی نظم، آرامشی است که در شب امتحان به سراغت می‌آید."},{text:"چکش اگر هر روز بکوبد، کوه را می‌شکافد؛ تو هم اگر هر روز بخوانی…"},{text:"مسیر یادگیری مارپیچ است؛ مهم این است که هر روز یک دور جلوتر باشی."},{text:"یک جلسه‌ی کوتاه اما منظم، از یک جلسه‌ی طولانی اما هرازگاهی بهتر است."},{text:"وقتی امروز سرِ قرارت با برنامه بیایی، فردا به خودت افتخار می‌کنی."},{text:"تا زمانی که قدم برمی‌داری، در مسیر هستی؛ این را هیچ‌وقت فراموش نکن."},{text:"تو از پسِ این همه سال درس خواندن برنیامده‌ای که حالا کم بیاری."},{text:"باور کن می‌توانی؛ نیمی از مسیر، باورِ توست."},{text:"ذهنِ تو قدرتمندتر از آن است که فکر می‌کنی؛ به آن اعتماد کن."},{text:"هر متخصصی روزی تازه‌کار بود؛ تو هم روزی به آن‌جا می‌رسی."},{text:"اشتباه‌های امروز، پله‌های فردایِ فهمیده‌تر تو هستند."},{text:"خودت را با نسخه‌ی دیروزت مقایسه کن، نه با رویای دیگران."},{text:"اگر هنوز نفس می‌کشی، هنوز فرصت داری؛ تمام."},{text:"تاریکیِ «نمی‌شود» را با چراغِ «می‌خواهم» روشن کن."},{text:"نگاه‌کن چقدر راه آمده‌ای؛ حالا برگرد و بقیه‌اش را هم برو."},{text:"توانایی تو از چیزی که الان می‌بینی بزرگ‌تر است."},{text:"همه‌ی دانشمندان بزرگ هم روزی از یک مطلب ساده شروع کردند."},{text:"تو برای تسلیم شدن ساخته نشده‌ای؛ ساخته شده‌ای برای تلاش و رسیدن."},{text:"ذهن تو مثل چراغ‌قوه است؛ هر جا که ببری‌اش، آن‌جا روشن می‌شود."},{text:"وقتی به خودت شک کردی، به تمام شب‌هایی فکر کن که بیدار ماندی و خواندی."},{text:"شکست یعنی یک پیام: «این راه را طور دیگری برو»؛ نه «بمان»."},{text:"تو لایقِ هدفی که برای خودت گذاشته‌ای هستی؛ فقط باید باورش کنی."},{text:"فردا صبح، آینه به تو نگاه می‌کند؛ به او ثابت کن که اهلِ تلاش است."},{text:"هر روزی که خواندی، یک «نه» بزرگ به ناامیدی گفته‌ای."},{text:"قلبت را خسته نکن؛ هنوز کلی راهِ روشن پیش رو داری."},{text:"امید، سوختِ مسیر است؛ با هر صفحه که می‌خوانی باکِت را پر کن."},{text:"امتحان، فقط نمایشِ تلاش‌های پنهان توست؛ نترس از نمایش."},{text:"شب امتحان، پاداش شب‌هایی است که خوانده‌ای؛ به خودت اعتماد کن."},{text:"اضطراب یعنی بدنت گفته آماده‌ام؛ به آن بگو پس بیا برویم بجنگیم."},{text:"سؤال‌های سخت، فقط برای کسانی سخت‌اند که تمرین نکرده‌اند."},{text:"به جای شمردن روزهای مانده، روزهای باقی‌مانده را بشمار و بخوان."},{text:"در جلسه‌ی امتحان فقط با برگه‌ات حرف بزن؛ بقیه‌ی دنیا صبر می‌کند."},{text:"نمره، عددی است؛ دانشی که می‌گیری برای همیشه مال توست."},{text:"وقتی برگه را برمی‌گردانی، یادت باشد هرچه بلدی از تلاش خودت است."},{text:"امتحان فردا، فقط یک ایستگاه است؛ نه پایان راه و نه شروع آن."},{text:"اگر آماده باشی، استرس جایش را به هیجان می‌دهد."},{text:"به جای «اگر قبول نشوم»، بگو «چطور بهتر شوم»."},{text:"درس‌های سخت، آدم‌های سخت‌کوش می‌سازند."},{text:"روز امتحان، روزِ دریافتِ حق‌ال
