 یک گنجینه می‌سازد."},{text:"جایزه‌ی نظم، آرامشی است که در شب امتحان به سراغت می‌آید."},{text:"چکش اگر هر روز بکوبد، کوه را می‌شکافد؛ تو هم اگر هر روز بخوانی…"},{text:"مسیر یادگیری مارپیچ است؛ مهم این است که هر روز یک دور جلوتر باشی."},{text:"یک جلسه‌ی کوتاه اما منظم، از یک جلسه‌ی طولانی اما هرازگاهی بهتر است."},{text:"وقتی امروز سرِ قرارت با برنامه بیایی، فردا به خودت افتخار می‌کنی."},{text:"تا زمانی که قدم برمی‌داری، در مسیر هستی؛ این را هیچ‌وقت فراموش نکن."},{text:"تو از پسِ این همه سال درس خواندن برنیامده‌ای که حالا کم بیاری."},{text:"باور کن می‌توانی؛ نیمی از مسیر، باورِ توست."},{text:"ذهنِ تو قدرتمندتر از آن است که فکر می‌کنی؛ به آن اعتماد کن."},{text:"هر متخصصی روزی تازه‌کار بود؛ تو هم روزی به آن‌جا می‌رسی."},{text:"اشتباه‌های امروز، پله‌های فردایِ فهمیده‌تر تو هستند."},{text:"خودت را با نسخه‌ی دیروزت مقایسه کن، نه با رویای دیگران."},{text:"اگر هنوز نفس می‌کشی، هنوز فرصت داری؛ تمام."},{text:"تاریکیِ «نمی‌شود» را با چراغِ «می‌خواهم» روشن کن."},{text:"نگاه‌کن چقدر راه آمده‌ای؛ حالا برگرد و بقیه‌اش را هم برو."},{text:"توانایی تو از چیزی که الان می‌بینی بزرگ‌تر است."},{text:"همه‌ی دانشمندان بزرگ هم روزی از یک مطلب ساده شروع کردند."},{text:"تو برای تسلیم شدن ساخته نشده‌ای؛ ساخته شده‌ای برای تلاش و رسیدن."},{text:"ذهن تو مثل چراغ‌قوه است؛ هر جا که ببری‌اش، آن‌جا روشن می‌شود."},{text:"وقتی به خودت شک کردی، به تمام شب‌هایی فکر کن که بیدار ماندی و خواندی."},{text:"شکست یعنی یک پیام: «این راه را طور دیگری برو»؛ نه «بمان»."},{text:"تو لایقِ هدفی که برای خودت گذاشته‌ای هستی؛ فقط باید باورش کنی."},{text:"فردا صبح، آینه به تو نگاه می‌کند؛ به او ثابت کن که اهلِ تلاش است."},{text:"هر روزی که خواندی، یک «نه» بزرگ به ناامیدی گفته‌ای."},{text:"قلبت را خسته نکن؛ هنوز کلی راهِ روشن پیش رو داری."},{text:"امید، سوختِ مسیر است؛ با هر صفحه که می‌خوانی باکِت را پر کن."},{text:"امتحان، فقط نمایشِ تلاش‌های پنهان توست؛ نترس از نمایش."},{text:"شب امتحان، پاداش شب‌هایی است که خوانده‌ای؛ به خودت اعتماد کن."},{text:"اضطراب یعنی بدنت گفته آماده‌ام؛ به آن بگو پس بیا برویم بجنگیم."},{text:"سؤال‌های سخت، فقط برای کسانی سخت‌اند که تمرین نکرده‌اند."},{text:"به جای شمردن روزهای مانده، روزهای باقی‌مانده را بشمار و بخوان."},{text:"در جلسه‌ی امتحان فقط با برگه‌ات حرف بزن؛ بقیه‌ی دنیا صبر می‌کند."},{text:"نمره، عددی است؛ دانشی که می‌گیری برای همیشه مال توست."},{text:"وقتی برگه را برمی‌گردانی، یادت باشد هرچه بلدی از تلاش خودت است."},{text:"امتحان فردا، فقط یک ایستگاه است؛ نه پایان راه و نه شروع آن."},{text:"اگر آماده باشی، استرس جایش را به هیجان می‌دهد."},{text:"به جای «اگر قبول نشوم»، بگو «چطور بهتر شوم»."},{text:"درس‌های سخت، آدم‌های سخت‌کوش می‌سازند."},{text:"روز امتحان، روزِ دریافتِ حق‌الزحمه‌ی توست؛ پس حق‌الزحمه‌ات را کامل کن."},{text:"تا لحظه‌ی آخر هم می‌شود برگه را برگرداند؛ اما بهتر است از حالا برگردانش."},{text:"کسی برنده است که در روزهای سخت، از روزهای راحت‌تر درس گرفته باشد."},{text:"یک امتحان بد، پایان دنیا نیست؛ شروع یک درس تازه است."},{text:"با هر مرور، نمره‌ی احتمالی‌ات در ذهنِ خودت بالا می‌رود؛ همین مهم است."},{text:"حافظه مانند عضله است؛ درست سرِ وقت امتحان، قوی‌ترین حالتش را نشان می‌دهد."},{text:"به جای نگرانی از نتیجه، به فرآیند عشق بورز؛ نتیجه دنبالش می‌آید."},{text:"امتحان، گفت‌وگوی تو با خودت است؛ نه رقابت با همکلاسی."},{text:"وقتی می‌خوانی، فقط بخوان؛ وقتی استراحت می‌کنی، فقط استراحت کن."},{text:"بیست دقیقه تمرکزِ واقعی، از دو ساعت حواس‌پرتی ارزشمندتر است."},{text:"گوشی را بگذار کنار؛ دنیا ده دقیقه‌ی دیگر هم سر جایش است."},{text:"سخت‌ترین قسمت هر کار، شروعش است؛ فقط سه‌دو بیا و شروع کن."},{text:"زمان مثل یخ است؛ اگر ذخیره‌اش نکنی، آب می‌شود و می‌رود."},{text:"هر روز یک «بهترین ساعت» برای مطالعه داری؛ پیدایش کن و برایش برنامه بریز."},{text:"صبح‌ها که مغز تازه است، سخت‌ترین درس‌ها را بخوان."},{text:"وقتِ تلف‌شده برنمی‌گردد؛ اما وقتِ باقی‌مانده، مالِ توست."},{text:"اگر تمرکز نداری، محیط را عوض کن؛ نه اینکه روز را رها کنی."},{text:"مطالعه‌ی فعال یعنی با مداد خواندن؛ خط بکش، خلاصه کن، سؤال بپرس."},{text:"به جای «وقت ندارم»، بگو «این را اولویت نمی‌دهم» و بعد اولویت را درست انتخاب کن."},{text:"پانزده دقیقه‌ی بین دو کار را هم می‌شود یک مرور کوچک کرد."},{text:"برای هر جلسه مطالعه، هدفِ کوچک و روشنی بگذار؛ مثل یک بازی."},{text:"وقتی خسته شدی، پنج دقیقه قدم بزن و برگرد؛ بدنِ تو هم تیم توست."},{text:"داشتنِ ساعتِ مشخص برای درس، ذهن را راحت می‌کند؛ تردید انرژی می‌سوزاند."},{text:"کارهای کوچک را جمع نکن؛ هر کدام را سرِ وقتش تمام کن."},{text:"تمرکز یعنی به یک چیز «بله» گفتن و به هزار چیز دیگر «نه»."},{text:"وقتِ طلاییِ بعد از بیداری را با شبکه‌های اجتماعی نسوزان."},{text:"برای هر مبحث، یک زمانِ پایان بگذار؛ کارهای ناتمام استرس می‌سازند."},{text:"روزت را با سخت‌ترین کار شروع کن؛ بقیه‌اش آسان می‌شود."},{text:"هر صفحه‌ای که حالا می‌خوانی، روزی جانِ یک آدم را نجات می‌دهد."},{text:"پزشکِ خوب شدن، از امشب و از همین کتاب شروع می‌شود."},{text:"دانشی که امروز با زحمت می‌گیری، فردا با اطمینان به کارش می‌گیری."},{text:"تصور کن ده سال دیگر، سرِ بالین بیماری ایستاده‌ای؛ او به دانش امروزِ تو نیاز دارد."},{text:"هیچ دانشجویی پشیمان نشده که «کاش کمتر درس می‌خواندم»."},{text:"روزی از این همه جزوه، فقط خاطره می‌ماند؛ اما آن‌چه یاد گرفته‌ای، می‌ماند."},{text:"سوادِ امروز، امنیتِ شغلی و آرامشِ فردای توست."},{text:"دنیا به آدم‌های باسواد و مهربان نیاز دارد؛ تو هر دو را بساز."},{text:"سال‌های دانشجویی، سرمایه‌گذاری روی نسخه‌ی آینده‌ی توست."},{text:"پیشرفت واقعی، مقایسه‌ی خودت با خودت است؛ نه با هیچ‌کس دیگر."},{text:"روزی که مدرک بگیری و یادت بیاید از کجا شروع کرده‌ای، اشکِ خوشحالی می‌ریزی."},{text:"بهترین زمان برای کاشتنِ درخت، ده سال پیش بود؛ دومین وقتش، همین امروز."},{text:"دانشجو بودن یعنی امروز سختی بکشی تا فردا راحت‌تر زندگی کنی."},{text:"کتاب‌هایی که حالا سنگین‌اند، روزی بال‌های تو می‌شوند."},{text:"خواستن، توانستن است.",author:"ضرب‌المثل"},{text:"قطره قطره جمع گردد وانگهی دریا شود.",author:"ضرب‌المثل"},{text:"توانا بود هر که دانا بود، ز دانش دل پیر برنا بود.",author:"سعدی"},{text:"علم چندان که بیشتر خوانی، چون عمل در تو نیست نادانی.",author:"سعدی"},{text:"نابرده رنج، گنج میسر نمی‌شود.",author:"سعدی"},{text:"هر که در پیِ دانش است، درهایِ خرد به رویش باز می‌شود."},{text:"دانش در جوانی مانند نقش بر سنگ است.",author:"حدیث"},{text:"طلبِ
