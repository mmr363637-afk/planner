    <!-- فونت وزیرمتنِ خود-میزبان (public/fonts): آفلاین-اول، بدون CDN. -->

    <!-- اسپلشِ بوت: تا React و چانک‌ها لود می‌شوند، کاربر به‌جای صفحه‌ی سفید این را
         می‌بیند (حیاتی برای حس سرعت روی گوشی). با اولین رندر، React جایش را می‌گیرد. -->
    <style>
      #boot-splash{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f8fafc;font-family:Vazirmatn,system-ui,sans-serif}
      @media (prefers-color-scheme:dark){#boot-splash{background:#0f172a;color:#e2e8f0}}
      #boot-splash .logo{width:64px;height:64px;border-radius:18px;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;box-shadow:0 8px 24px rgba(13,148,136,.35)}
      #boot-splash .name{font-weight:800;font-size:17px;color:#334155}
      @media (prefers-color-scheme:dark){#boot-splash .name{color:#e2e8f0}}
      #boot-splash .bar{width:120px;height:5px;border-radius:99px;background:#e2e8f0;overflow:hidden}
      @media (prefers-color-scheme:dark){#boot-splash .bar{background:#334155}}
      #boot-splash .bar i{display:block;height:100%;width:40%;border-radius:99px;background:#0d9488;animation:boot-slide 1s ease-in-out infinite alternate}
      @keyframes boot-slide{from{transform:translateX(160%)}to{transform:translateX(-10%)}}
      #boot-splash .tip{font-size:11px;color:#94a3b8}
    </style>

    <!-- فایل‌های PWA مستقیماً از public/ سرو می‌شوند. مسیرها را از ریشه بنویسید تا
         Vite آن‌ها را هَش (bundle) نکند؛ سرویس‌ورکر دقیقاً همین نام‌ها را پیش‌کش
         می‌کند و در build به زیرمسیرِ GitHub Pages («./…») تبدیل می‌شوند. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-512.png" />

    <title>برنامه‌ریز مطالعه | Study Planner</title>
    <script type="module" crossorigin src="./assets/index-DyBN00XY.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vendor-ByNFwixe.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BievVgV-.css">
  </head>

  <body>
    <div id="root"><div id="boot-splash"><div class="logo">م</div><div class="name">برنامه‌ریز مطالعه</div><div class="bar"><i></i></div><div class="tip">در حال باز شدن…</div></div></div>

    <!-- نقطهٔ ورود واقعی اپ. این خط را هرگز با خروجی build جایگزین نکنید: اگر
         محتوای build شدهٔ inlined روی همین فایل کپی شود، هم `npm run dev` و هم
         `npm run build` دیگر هیچ‌وقت src/ را کامپایل نمی‌کنند و تمام فیچرهای جدید
         از دید کاربر ناپدید می‌شوند. خروجی build فقط در docs/ نوشته می‌شود. -->
    <!--
      DEMO ONLY (dev/preview): با ?demo=1 دادهٔ نمونهٔ واقعی (فلش‌کارت‌های برگرفته از
      بانکِ سؤال) داخلِ localStorage ریخته می‌شود تا بتوان شبیه‌ساز آزمون را پرکرده
      دید. بدونِ این پارامتر هیچ کاری نمی‌کند و در build واقعی هم بی‌اثر است.
    -->
    <script>
      (function () {
        try {
          // مسیرهای کوتاه (مثل /simulator) فقط میان‌برند: به همان کوئریِ کامل ریدایرکت
          // می‌شوند تا پیش‌نمایش/اشتراک‌گذاری بدونِ تایپِ پارامتر کار کند.
          var shortPaths = {
            "/simulator": "?demo=1&open=simulator",
            "/sim": "?demo=1&open=simulator",
            "/exambank": "?demo=1&open=exambank",
            "/guide": "?demo=1&open=guide",
          };
          var short = shortPaths[location.pathname.replace(/\/$/, "")];
          // "./"+query از ریشهٔ همان زیرمسیر حل می‌شود (سازگار با GitHub Pages) و چون
          // مسیر عوض می‌شود، این بلوک دیگر تکرار نمی‌شود (بدونِ حلقهٔ ریدایرکت).
          if (short) {
            location.replace("./" + short);
            return;
          }
          if (!/[?&]demo=1/.test(location.search)) return;
          var xhr = new XMLHttpRequest();
          xhr.open("GET", "./__demo-state.json", false);
          xhr.send(null);
          if (xhr.status < 200 || xhr.status >= 300) return;
          localStorage.setItem("study-planner-v1", xhr.responseText);
        } catch (e) {
          /* دمو نباید هرگز مانعِ باز شدنِ اپ شود */
        }
      })();
    </script>
  </body>
</html>
