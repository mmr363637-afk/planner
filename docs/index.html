ر روز تمرینش کن."},{text:"اگر مسیر درست را می‌روی، حتی قدم‌های کوچکت هم تو را به مقصد می‌رساند."},{text:"مغز تو هر بار که چیزی یاد می‌گیرد، قوی‌تر می‌شود؛ امروز هم تمرینش بده."},{text:"انرژی‌ات را صرف نگرانی نکن؛ صرف خواندنِ همان یک صفحه‌ای کن که جلوی توست."},{text:"وقتی اراده می‌کنی، بهانه‌ها خودشان کوچک می‌شوند."},{text:"قدرت در یک روزِ عالی نیست؛ در روزهای معمولی‌ای است که تکرارشان می‌کنی."},{text:"نظم، پلِ بینِ آرزو و واقعیت است."},{text:"بهترین برنامه، برنامه‌ای است که امروز شروعش کنی، نه فردا."},{text:"هر روز کمی مطالعه، بهتر از یک روزِ سنگین و هفته‌ها فاصله است."},{text:"عادت‌های کوچک روزانه، نتایج بزرگی می‌سازند که سال بعد شگفت‌زده‌ات می‌کند."},{text:"تقویم پر از روزهای خالی است؛ تو می‌توانی بهترین‌هایش را پر کنی."},{text:"دیروز رفته و فردا نیامده؛ تنها امروز را داری، پس امروز را دریاب."},{text:"برنامه ریختن نصف کار است؛ نصف دیگرش، همان‌قسمتِ اولِ امروز است."},{text:"انضباط یعنی انتخابِ چیزی که می‌خواهی، نه چیزی که الان دلت می‌خواهد."},{text:"اگر هر روز فقط یک ساعت عمیق درس بخوانی، در یک سال ۳۶۵ ساعت جلو می‌افتی."},{text:"یک روز جا زدن، آسان است؛ برگشتن به مسیر، نشانه‌ی بزرگی توست."},{text:"هر روز صبح یک قرار داری: با کتابی که فردای بهتری برایت می‌سازد."},{text:"وقتی برنامه می‌چینی، به قولت پایبند باش؛ حتی اگر فقط ده دقیقه باشد."},{text:"تمرینِ هر روز، از حافظه‌ات یک گنجینه می‌سازد."},{text:"جایزه‌ی نظم، آرامشی است که در شب امتحان به سراغت می‌آید."},{text:"چکش اگر هر روز بکوبد، کوه را می‌شکافد؛ تو هم اگر هر روز بخوانی…"},{text:"مسیر یادگیری مارپیچ است؛ مهم این است که هر روز یک دور جلوتر باشی."},{text:"یک جلسه‌ی کوتاه اما منظم، از یک جلسه‌ی طولانی اما هرازگاهی بهتر است."},{text:"وقتی امروز سرِ قرارت با برنامه بیایی، فردا به خودت افتخار می‌کنی."},{text:"تا زمانی که قدم برمی‌داری، در مسیر هستی؛ این را هیچ‌وقت فراموش نکن."},{text:"تو از پسِ این همه سال درس خواندن برنیامده‌ای که حالا کم بیاری."},{text:"باور کن می‌توانی؛ نیمی از مسیر، باورِ توست."},{text:"ذهنِ تو قدرتمندتر از آن است که فکر می‌کنی؛ به آن اعتماد کن."},{text:"هر متخصصی روزی تازه‌کار بود؛ تو هم روزی ب
