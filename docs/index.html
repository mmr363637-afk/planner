ssName:"text-xl",children:py[u]}),Fm[u]]},u))})}const An=[{text:"تلاشِ بی‌وقفه، تنها چیزی است که هیچ‌کس نمی‌تواند از تو بگیرد."},{text:"هر روز یک قدم کوچک بردار؛ کوه هم از قدم‌های کوچک فتح می‌شود."},{text:"درس خواندن، بذر آینده‌ای است که امروز با دست‌های خودت می‌کاری."},{text:"وقتی خسته شدی، یادت بیاور چرا شروع کردی."},{text:"موفقیت چیزی نیست جز جمعِ کوچک‌ترین عادت‌های روزانه."},{text:"آینده‌ای که آرزویش را داری، پشت همین چند صفحه‌ی بعدی منتظر است."},{text:"راه صدساله را نمی‌شود یک‌شبه رفت؛ اما می‌شود هر روز یک قدم محکم برداشت."},{text:"تنها رقیب واقعی تو، نسخه‌ی دیروز خودت است."},{text:"هیچ تلاشی بی‌نتیجه نمی‌ماند؛ نتیجه‌اش یا امروز است یا فردا."},{text:"کتابی که امروز می‌بندی، درِ فردایی را باز می‌کند که دوست داری."},{text:"مطالعه مثل بیل‌زدن است؛ شاید عرق داشته باشد اما زمین را آماده‌ی برداشت می‌کند."},{text:"وقتی کار سخت شد، یعنی همان‌جایی هستی که بقیه کم می‌آورند."},{text:"کسی که شروع می‌کند نصف راه را رفته است؛ تو فقط باید بنشینی و شروع کنی."},{text:"دانش، تنها سرمایه‌ای است که هرچه خرجش کنی بیشتر می‌شود."},{text:"اشکالی ندارد آهسته پیش بروی؛ اشکال دارد که بایستی."},{text:"سخت‌کوشی، استعدادِ همه‌کس است؛ هر روز تمرینش کن."},{text:"اگر مسیر درست را می‌روی، حتی قدم‌های کوچکت هم تو را به مقصد می‌رساند."},{text:"مغز تو هر بار که چیزی یاد می‌گیرد، قوی‌تر می‌شود؛ امروز هم تمرینش بده."},{text:"انرژی‌ات را صرف نگرانی نکن؛ صرف خواندنِ همان یک صفحه‌ای کن که جلوی توست."},{text:"وقتی اراده می‌کنی، بهانه‌ها خودشان کوچک می‌شوند."},{text:"قدرت در یک روزِ عالی نیست؛ در روزهای معمولی‌ای است که تکرارشان می‌کنی."},{text:"نظم، پلِ بینِ آرزو و واقعیت است."},{text:"بهترین برنامه، برنامه‌ای است که امروز شروعش کنی، نه فردا."},{text:"هر روز کمی مطالعه، بهتر از یک روزِ سنگین و هفته‌ها فاصله است."},{text:"عادت‌های کوچک روزانه، نتایج بزرگی می‌سازند که سال بعد شگفت‌زده‌ات می‌کند."},{text:"تقویم پر از روزهای خالی است؛ تو می‌توانی بهترین‌هایش را پر کنی."},{text:"دیروز رفته و فردا نیامده؛ تنها امروز را داری، پس امروز را دریاب."},{text:"برنامه ریختن نصف کار است؛ نصف دیگرش، همان‌قسمتِ اولِ امروز است."},{text:"انضباط یعنی انتخابِ چیزی که می‌خواهی، نه چیزی که الان دلت می‌خواهد."},{text:"اگر هر روز فقط یک ساعت عمیق درس بخوانی، در یک سال ۳۶۵ ساعت جلو می‌افتی."},{text:"یک روز جا زدن، آسان است؛ برگشتن به مسیر، نشانه‌ی بزرگی توست."},{text:"هر روز صبح یک قرار داری: با کتابی که فردای بهتری برایت می‌سازد."},{text:"وقتی برنامه می‌چینی، به قولت پایبند باش؛ حتی اگر فقط ده دقیقه باشد."},{text:"تمرینِ هر روز، از حافظه‌ات یک گنجینه می‌سازد."},{text:"جایزه‌ی نظم، آرامشی است که در شب امتحان به سراغت می‌آید."},{text:"چکش اگر هر روز بکوبد، کوه را می‌شکافد؛ تو هم اگر هر روز بخوانی…"},{text:"مسیر یادگیری مارپیچ است؛ مهم این است که هر روز یک دور جلوتر باشی."},{text:"یک جلسه‌ی کوتاه اما منظم، از یک جلسه‌ی طولانی اما هرازگاهی بهتر است."},{text:"وقتی امروز سرِ قرارت با برنامه بیایی، فردا به خودت افتخار می‌کنی."},{text:"تا زمانی که قدم برمی‌داری، در مسیر هستی؛ این را هیچ‌وقت فراموش نکن."},{text:"تو از پسِ این همه سال درس خواندن برنیامده‌ای که حالا کم بیاری."},{text:"باور کن می‌توانی؛ نیمی از مسیر، باورِ توست."},{text:"ذهنِ تو قدرتمندتر از آن است که فکر می‌کنی؛ به آن اعتماد کن."},{text:"هر متخصصی روزی تازه‌کار بود؛ تو هم روزی به آن‌جا می‌رسی."},{text:"اشتباه‌های امروز، پله‌های فردایِ فهمیده‌تر تو هستند."},{text:"خودت را با نسخه‌ی دیروزت مقایسه کن، نه با رویای دیگران."},{text:"اگر هنوز نفس می‌کشی، هنوز فرصت داری؛ تمام."},{text:"تاریکیِ «نمی‌شود» را با چراغِ «می‌خواهم» روشن کن."},{text:"نگاه‌کن چقدر راه آمده‌ای؛ حالا برگرد و بقیه‌اش را هم برو."},{text:"توانایی تو از چیزی که الان می‌بینی بزرگ‌تر است."},{text:"همه‌ی دانشمندان بزرگ هم روزی از یک مطلب ساده شروع کردند."},{text:"تو برای تسلیم شدن ساخته نشده‌ای؛ ساخته شده‌ای برای تلاش و رسیدن."},{text:"ذهن تو مثل چراغ‌قوه است؛ هر جا که ببری‌اش، آن‌جا روشن می‌شود."},{text:"وقتی به خودت شک کردی، به تمام شب‌هایی فکر کن که بیدار ماندی و خواندی."},{text:"شکست یعنی یک پیام: «این راه را طور دیگری برو»؛ نه «بمان»."},{text:"تو لایقِ هدفی که برای خودت گذاشته‌ای هستی؛ فقط باید باورش کنی."},{text:"فردا صبح، آینه به تو نگاه می‌کند؛ به او ثابت کن که اهلِ ."},{text:"صبح‌ها که مغز تازه است، سخت‌ترین درس‌ها را بخوان."},{text:"وقتِ تلف‌شده برنمی‌گردد؛ اما وقتِ باقی‌مانده، مالِ توست."},{text:"اگر تمرکز نداری، محیط را عوض کن؛ نه اینکه روز را رها کنی."},{text:"مطالعه‌ی فعال یعنی با مداد خواندن؛ خط بکش، خلاصه کن، سؤال بپرس."},{text:"به جای «وقت ندارم»، بگو «این را اولویت نمی‌دهم» و بعد اولویت را درست انتخاب کن."},{text:"پانزده دقیقه‌ی بین دو کار را هم می‌شود یک مرور کوچک کرد."},{text:"برای هر جلسه مطالعه، هدفِ کوچک و روشنی بگذار؛ مثل یک بازی."},{text:"وقتی خسته شدی، پنج دقیقه قدم بزن و برگرد؛ بدنِ تو هم تیم توست."},{text:"داشتنِ ساعتِ مشخص برای درس، ذهن را راحت می‌کند؛ تردید انرژی می‌سوزاند."},{text:"کارهای کوچک را جمع نکن؛ هر کدام را سرِ وقتش تمام کن."},{text:"تمرکز یعنی به یک چیز «بله» گفتن و به هزار چیز دیگر «نه»."},{text:"وقتِ طلاییِ بعد از بیداری را با شبکه‌های اجتماعی نسوزان."},{text:"برای هر مبحث، یک زمانِ پایان بگذار؛ کارهای ناتمام استرس می‌سازند."},{text:"روزت را با سخت‌ترین کار شروع کن؛ بقیه‌اش آسان می‌شود."},{text:"هر صفحه‌ای که حالا می‌خوانی، روزی جانِ یک آدم را نجات می‌دهد."},{text:"پزشکِ خوب شدن، از امشب و از همین کتاب شروع می‌شود."},{text:"دانشی که امروز با زحمت می‌گیری، فردا با اطمینان به کارش می‌گیری."},{text:"تصور کن ده سال دیگر، سرِ بالین بیماری ایستاده‌ای؛ او به دانش امروزِ تو نیاز دارد."},{text:"هیچ دانشجویی پشیمان نشده که «کاش کمتر درس می‌خواندم»."},{text:"روزی از این همه جزوه، فقط خاطره می‌ماند؛ اما آن‌چه یاد گرفته‌ای، می‌ماند."},{text:"سوادِ امروز، امنیتِ شغلی و آرامشِ فردای توست."},{text:"دنیا به آدم‌های باسواد و مهربان نیاز دارد؛ تو هر دو را بساز."},{text:"سال‌های دانشجویی، سرمایه‌گذاری روی نسخه‌ی آینده‌ی توست."},{text:"پیشرفت واقعی، مقایسه‌ی خودت با خودت است؛ نه با هیچ‌کس دیگر."},{text:"روزی که مدرک بگیری و یادت بیاید از کجا شروع کرده‌ای، اشکِ خوشحالی می‌ریزی."},{text:"بهترین زمان برای کاشتنِ درخت، ده سال پیش بود؛ دومین وقتش، همین امروز."},{text:"دانشجو بودن یعنی امروز سختی بکشی تا فردا راحت‌تر زندگی کنی."},{text:"کتاب‌هایی که حالا سنگین‌اند، روزی بال‌های تو می‌شوند."},{text:"خواستن، توانستن است."
